<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сапер · базовая версия</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-container">
  <div class="header">
    <div class="mine-counter" id="mineCounter">010</div>
    <div class="smiley" id="resetButton">😊</div>
    <div class="mine-counter" id="timerDisplay">000</div>
  </div>
  <div class="difficulty-panel">
    <button class="diff-btn active" data-rows="9" data-cols="9" data-mines="10" type="button">9×9</button>
    <button class="diff-btn" data-rows="12" data-cols="12" data-mines="25" type="button">12×12</button>
    <button class="diff-btn" data-rows="24" data-cols="24" data-mines="99" type="button">24×24</button>
  </div>
  <div class="play-area">
    <div class="board" id="board"></div>
    <div class="mode-panel">
      <button class="mode-btn active" id="modeOpen" data-mode="reveal" type="button">
        <span class="mode-icon">⛏</span><span class="mode-label">Открыть</span>
      </button>
      <button class="mode-btn" id="modeFlag" data-mode="flag" type="button">
        <span class="mode-icon">⚑</span><span class="mode-label">Флаг</span>
      </button>
    </div>
  </div>
  <div class="footer">💡 <span>режим</span> задаёт тап по клетке · на ПК <span>ПКМ</span> — всегда флаг</div>
</div>
  <button class="floating-reset" id="floatingReset" type="button" aria-label="Начать заново">🔄</button>

  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Настройки темы">🎨</button>
  <div class="theme-backdrop" id="themeBackdrop"></div>
  <div class="theme-panel" id="themePanel" aria-hidden="true">
    <div class="theme-panel-header">
      <span>Настройка темы</span>
      <button class="theme-close" id="themeClose" type="button" aria-label="Закрыть">✕</button>
    </div>

    <!-- ГОТОВЫЕ ТЕМЫ (ПРЕСЕТЫ) -->
    <div class="theme-group theme-presets">
      <div class="theme-group-title">🎨 Готовые темы</div>
      <div class="preset-buttons">
        <button class="preset-btn active" data-preset="neon" type="button" style="--preset-color: #00ffd0;">Неон</button>
        <button class="preset-btn" data-preset="light" type="button" style="--preset-color: #f5f0e8;">Светлая</button>
        <button class="preset-btn" data-preset="purple" type="button" style="--preset-color: #b174ff;">Фиолетовая</button>
        <button class="preset-btn" data-preset="gray" type="button" style="--preset-color: #888;">Серая</button>
      </div>
    </div>

    <div class="theme-group">
      <div class="theme-group-title"><span class="theme-swatch" id="swatchBg"></span>Фон</div>
      <label><span>Оттенок</span><input type="range" id="bgHue" min="0" max="360" step="1"></label>
      <label><span>Насыщенность</span><input type="range" id="bgSat" min="0" max="100" step="1"></label>
      <label><span>Яркость</span><input type="range" id="bgLight" min="0" max="40" step="1"></label>
    </div>

    <div class="theme-group">
      <div class="theme-group-title"><span class="theme-swatch" id="swatchA1"></span>Акцент 1 (числа, режим «Открыть»)</div>
      <label><span>Оттенок</span><input type="range" id="a1Hue" min="0" max="360" step="1"></label>
      <label><span>Насыщенность</span><input type="range" id="a1Sat" min="0" max="100" step="1"></label>
      <label><span>Яркость</span><input type="range" id="a1Light" min="30" max="80" step="1"></label>
    </div>

    <div class="theme-group">
      <div class="theme-group-title"><span class="theme-swatch" id="swatchA2"></span>Акцент 2 (флаг, режим «Флаг»)</div>
      <label><span>Оттенок</span><input type="range" id="a2Hue" min="0" max="360" step="1"></label>
      <label><span>Насыщенность</span><input type="range" id="a2Sat" min="0" max="100" step="1"></label>
      <label><span>Яркость</span><input type="range" id="a2Light" min="30" max="80" step="1"></label>
    </div>

    <button class="theme-reset" id="themeReset" type="button">Сбросить на стандартную тему</button>
  </div>

  <script src="./script.js"> </script>
</body>
</html>
